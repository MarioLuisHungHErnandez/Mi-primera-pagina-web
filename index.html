<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mario · Página personal</title>
  <!-- Estilos simples y modernos -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(145deg, #f9f9fb 0%, #eef0f5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.5;
      color: #1e1e2f;
    }

    .tarjeta {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 2rem;
      padding: 3rem 2.5rem;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.2), 0 8px 18px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: transform 0.25s ease;
    }

    .tarjeta:hover {
      transform: scale(1.01);
    }

    h1 {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .emoji-svg {
      font-size: 2.8rem;
      line-height: 1;
    }

    .saludo {
      font-size: 1.35rem;
      font-weight: 400;
      color: #3d3d5c;
      margin-bottom: 1.25rem;
      border-left: 5px solid #6c5ce7;
      padding-left: 1.25rem;
      background: linear-gradient(to right, #f0edff, transparent);
      border-radius: 0 8px 8px 0;
      padding: 0.75rem 1.25rem;
    }

    .destacado {
      font-weight: 600;
      color: #6c5ce7;
      background: #e9e5ff;
      display: inline-block;
      padding: 0.1rem 0.6rem;
      border-radius: 30px;
      font-size: 0.95rem;
      margin-left: 0.3rem;
    }

    p {
      font-size: 1.15rem;
      margin: 1.5rem 0;
      color: #2d2d44;
    }

    .enlaces {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 2rem;
    }

    .boton {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #ffffff;
      border: 1.5px solid #d0d0e0;
      padding: 0.75rem 1.75rem;
      border-radius: 60px;
      font-weight: 500;
      text-decoration: none;
      color: #1e1e2f;
      transition: all 0.2s ease;
      font-size: 1rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    .boton:hover {
      background: #6c5ce7;
      border-color: #6c5ce7;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 12px 20px -10px #6c5ce7;
    }

    .boton-primario {
      background: #1e1e2f;
      border-color: #1e1e2f;
      color: white;
    }

    .boton-primario:hover {
      background: #2f2f4a;
      border-color: #2f2f4a;
      color: white;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      color: #6a6a85;
      text-align: center;
      border-top: 1px solid #dbdbe8;
      padding-top: 1.8rem;
    }

    /* pequeños ajustes responsive */
    @media (max-width: 500px) {
      .tarjeta {
        padding: 2rem 1.5rem;
      }
      h1 {
        font-size: 2.5rem;
      }
      .saludo {
        font-size: 1.15rem;
        padding: 0.6rem 1rem;
      }
      .enlaces {
        flex-direction: column;
      }
      .boton {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main class="tarjeta">
    <h1>
      <span class="emoji-svg" aria-hidden="true">👋</span>
      Hola, soy Mario
    </h1>

    <div class="saludo">
      <span class="destacado">Bienvenido</span> a mi primera página en GitHub
    </div>

    <p>
      Este es mi espacio personal. Me encanta la tecnología, el diseño y aprender cosas nuevas.
      Esta página es el comienzo de muchos proyectos geniales.
    </p>

    <div class="enlaces">
      <a href="https://github.com/mario" class="boton boton-primario" target="_blank" rel="noopener noreferrer">
        🐙 Mi GitHub
      </a>
      <a href="#" class="boton" onclick="alert('¡Pronto habrá más contenido!'); return false;">
        📬 Contacto
      </a>
    </div>

    <footer>
      © 2025 Mario · Hecho con ❤️ para GitHub Pages
    </footer>
  </main>
</body>
</html>
